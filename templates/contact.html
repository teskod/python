{% block title %}Холбоо барих{% endblock %}
{% block content %}
<section class="wrap section narrow">
    <h1 class="page-title">Холбоо барих</h1>

        <label>Нэр <input type="text" name="name" required></label>

    </form>
</section>
{% endblock %}
